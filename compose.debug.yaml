version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-coding-tutor-backend-debug
    command: |
      sh -c "pip install debugpy -t /tmp && 
      python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 
      -m uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
      - "5678:5678"
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - PYTHONUNBUFFERED=1
      - PERSIST_DIR=/app/vector_db
    volumes:
      - ./backend:/app
      - ./backend/vector_db:/app/vector_db
      - ./data:/app/data
    networks:
      - coding-tutor-network

networks:
  coding-tutor-network:
    driver: bridge
