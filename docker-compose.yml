services:
  backend:
    build: ./backend
    container_name: coding-tutor-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/vector_db:/app/vector_db
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/chat_history.db:/app/chat_history.db
      - ./data:/app/data
    networks:
      - coding-tutor-network

networks:
  coding-tutor-network:
    driver: bridge